name: E2E Tests Old

on:
  workflow_dispatch:
    inputs:
      WP_VERSION:
        description: 'WordPress version'
        default: '6.9'
      WC_VERSION:
        description: 'WooCommerce version'
        default: '10.4.3'
      TEST_SUITE:
        description: 'Test suite to run'
        required: true
        default: 'critical'
        type: choice
        options:
          - critical
          # - smoke
          - all
          - refund
          - grep
      TEST_GREP_PATTERN:
        description: 'Grep pattern (only used when "Test suite to run" == "grep")'
        required: false
        type: string
      PACKAGE_VERSION:
        description: 'Package Version'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build package
    uses: inpsyde/reusable-workflows/.github/workflows/build-plugin-archive.yml@main
    with:
      PLUGIN_VERSION: ${{ inputs.PACKAGE_VERSION }}
      NODE_VERSION: 22
      PHP_VERSION: 7.4
      PLUGIN_MAIN_FILE: ./mollie-payments-for-woocommerce.php
      PLUGIN_FOLDER_NAME: mollie-payments-for-woocommerce
      ARCHIVE_NAME: mollie-payments-for-woocommerce
      COMPILE_ASSETS_ARGS: '-vv --env=root'

  E2ETests:
    name: E2E Tests
    needs: build
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: 2
    steps:
      - name: Add custom domain to hosts
        run: echo "127.0.0.1 mywp.site" | sudo tee -a /etc/hosts

      - uses: actions/checkout@v2

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: mollie-payments-for-woocommerce
          path: ./tests/qa/resources/files

      - name: Create and upload zip file
        working-directory: ./tests/qa/resources/files
        run: |
          zip -r ./mollie-payments-for-woocommerce.zip ./mollie-payments-for-woocommerce
          rm -rf mollie-payments-for-woocommerce

      - name: Configure npm for GitHub Packages
        working-directory: ./tests/qa
        run: |
          # Create clean .npmrc
          echo "@inpsyde:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_SYDE }}" >> .npmrc

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: "./tests/inc/inpsyde"
        env:
          COMPOSER_AUTH: '{ "http-basic": { "repo.packagist.com": { "username": "${{ secrets.SYDE_COMPOSER_USER }}", "password": "${{ secrets.SYDE_COMPOSER_PASSWORD }}" }}}'

      - name: Install Environment
        working-directory: ./tests/qa
        run: npm run setup:env

      - name: Install WP release candidate (optional)
        if: github.event.inputs.WP_VERSION != ''
        working-directory: ./tests/qa
        env:
          INPUT_WP_VERSION: ${{ github.event.inputs.WP_VERSION }}
        run: |
          npm run -- wp-env run tests-cli -- wp core update --version="${INPUT_WP_VERSION}"
          npm run -- wp-env run tests-cli -- wp core update-db

      - name: Install WC release candidate (optional)
        if: github.event.inputs.WC_VERSION != ''
        working-directory: ./tests/qa
        env:
          INPUT_WC_VERSION: ${{ github.event.inputs.WC_VERSION }}
        run: |
          npm run -- wp-env run tests-cli -- wp plugin update woocommerce --version="${INPUT_WC_VERSION}"
          npm run -- wp-env run tests-cli -- wp wc update

      - name: Install Tests
        working-directory: ./tests/qa
        run: npm run setup:tests

      - name: Create .env file
        working-directory: ./tests/qa
        run: |
          echo "${{ secrets.QA_ENV_FILE }}" > .env
          
      - name: Validate grep pattern
        if: github.event.inputs.TEST_SUITE == 'grep' && github.event.inputs.TEST_GREP_PATTERN == ''
        run: |
          echo "::error::Grep pattern is required when TEST_SUITE is 'grep'"
          exit 1

      - name: Run E2E tests
        working-directory: ./tests/qa
        run: |
          if [ "${{ github.event.inputs.TEST_SUITE }}" == "grep" ]; then
            npx playwright test --grep "${{ github.event.inputs.TEST_GREP_PATTERN }}"
          else
            npm run test:${{ github.event.inputs.TEST_SUITE }}
          fi

      - name: Archive Playwright Report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: tests/qa/playwright-report
          if-no-files-found: ignore
          retention-days: 5

      - name: Archive Test Results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/qa/test-results/
          if-no-files-found: ignore
          retention-days: 5
